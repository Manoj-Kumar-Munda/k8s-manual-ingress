apiVersion: v1
kind: Namespace
metadata:
  name: backend-team
  labels:
    name: backend-team
---
# Backend app settings (ConfigMap) — safe to store in plain YAML
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: backend-team
data:
  DB_HOST: db.default.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: postgres
  DB_USER: postgres
  PORT: "3000"
---
# DB password for the backend (Secret)
apiVersion: v1
kind: Secret
metadata:
  name: backend-db-secret
  namespace: backend-team
type: Opaque
stringData:
  DB_PASSWORD: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: backend-team
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: manojkr999/kubernetes-node:3
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: backend-team
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
